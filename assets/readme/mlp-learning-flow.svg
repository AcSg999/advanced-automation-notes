<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">A fully connected multilayer perceptron learning</title>
  <desc id="desc">Every neuron connects to every neuron in the next layer. Activations sweep forward from the inputs to the output, then gradients sweep back along the same connections.</desc>
  <rect width="1200" height="470" rx="24" fill="#F7F8F5"/>
  <text x="64" y="75" fill="#14282E" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="38" font-weight="700" letter-spacing="-1">How an MLP learns</text>
  <text x="66" y="111" fill="#52636A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Every neuron connects to every neuron in the next layer.</text>

